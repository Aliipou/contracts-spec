[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-os-contracts"
version = "0.2.0"
description = "The installable root-of-truth contracts for the Decision OS: schemas, the single decision contract, the shared conformance enforcers, and validation helpers. Every repo depends on this; it depends on nothing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Ali Pourrahim" }]
# `validate()` ships in the package (consumers call it), so the JSON Schema
# validator is a genuine runtime dependency of THIS package.
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
# Ship the whole package dir — including the schema *.json (data) and the
# conformance checkers — so consumers get schemas + validate + rule A/B enforcers.
packages = ["decision_os_contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
