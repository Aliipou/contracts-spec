name: ci

# contracts-spec is now the installable `decision-os-contracts` package (the root
# of truth). CI installs it editable, validates every schema/example, and runs
# the shared conformance enforcers against itself.
on: [push, pull_request]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (editable, with dev tools)
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check decision_os_contracts tests
      - name: Validate contracts (schemas + examples + frozen invariants)
        run: pytest -q
      - name: Self-check enforcers (rules A & B run clean on this repo)
        run: |
          python -m decision_os_contracts.conformance.check_authority --roots decision_os_contracts/conformance
          python -m decision_os_contracts.conformance.check_imports --policy decision_os_contracts/conformance/self_policy.json
